<!doctype html>
<html lang="nl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Kracht Tracker</title>
<style>
  :root {
    --teal-deep:#0b4f4a; --teal:#137a70; --teal-soft:#e2f1ee;
    --blue:#1565c0; --blue-soft:#e3edf9;
    --terra:#c96a4a; --terra-deep:#a8502f; --terra-soft:#f8e8e0;
    --bg:#eef4f2; --card:#ffffff; --text:#12312d; --muted:#5f7a75;
    --green:#1b7f5a; --green-soft:#e0f2e8;
    --red:#b4482f; --border:#e2ebe8; --input-bg:#edf3f1; --chip:#ddeee9;
    --shadow:0 2px 10px rgba(11,79,74,.08);
  }
  body.dark {
    --teal-deep:#0a3531; --teal:#2a9d8f; --teal-soft:#123833;
    --blue:#5b9bd5; --blue-soft:#16293d;
    --terra:#d9825f; --terra-deep:#c96a4a; --terra-soft:#3a251c;
    --bg:#0e1715; --card:#152019; --text:#e4efe9; --muted:#87a09a;
    --green:#3cba8c; --green-soft:#14332a;
    --red:#e0705a; --border:#22322c; --input-bg:#1d2b25; --chip:#1b3a33;
    --shadow:none;
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family: system-ui, -apple-system, sans-serif; background: radial-gradient(1200px 500px at 50% -100px, var(--teal-soft), transparent), var(--bg); color:var(--text); padding-bottom:96px; }
  header { background:linear-gradient(120deg, var(--teal-deep), var(--teal)); color:#fff; padding:14px 16px; position:sticky; top:0; z-index:10; display:flex; justify-content:space-between; align-items:center; border-radius:0 0 18px 18px; box-shadow:var(--shadow); }
  header h1 { font-size:17px; font-weight:700; letter-spacing:.2px; }
  header .today { font-size:12px; opacity:.85; }
  header button { background:rgba(255,255,255,.18); color:#fff; border:1px solid rgba(255,255,255,.25); border-radius:10px; padding:6px 10px; font-size:15px; }
  main { padding:12px; max-width:520px; margin:0 auto; }
  .card { background:var(--card); border-radius:16px; padding:14px 16px; margin-bottom:12px; box-shadow:var(--shadow); border:1px solid var(--border); }
  .card h2 { font-size:13px; margin-bottom:10px; color:var(--teal); text-transform:uppercase; letter-spacing:.6px; font-weight:800; }
  .row { display:flex; justify-content:space-between; align-items:center; gap:8px; padding:11px 0; border-bottom:1px solid var(--border); }
  .row:last-child { border-bottom:none; }
  .row .name { font-weight:600; font-size:15px; }
  .row .sub { color:var(--muted); font-size:12px; margin-top:2px; }
  .done .name { color:var(--green); }
  .skipped .name { color:var(--muted); text-decoration:line-through; }
  .warn { color:var(--terra-deep); font-size:12px; margin-top:3px; font-weight:600; }
  button { border:none; border-radius:10px; padding:9px 12px; font-size:13px; font-weight:600; cursor:pointer; }
  .btn-blue { background:linear-gradient(135deg, var(--teal), var(--teal-deep)); color:#fff; }
  .btn-green { background:var(--green); color:#fff; }
  .btn-terra { background:linear-gradient(135deg, var(--terra), var(--terra-deep)); color:#fff; }
  .btn-ghost { background:var(--input-bg); color:var(--text); border:1px solid var(--border); }
  .btn-red { background:var(--terra-soft); color:var(--red); }
  .btn-sm { padding:6px 9px; font-size:12px; }
  .big { width:100%; padding:14px; font-size:16px; border-radius:14px; }
  .nav { position:fixed; bottom:0; left:0; right:0; background:var(--card); display:flex; border-top:1px solid var(--border); padding-bottom:env(safe-area-inset-bottom); z-index:10; }
  .nav button { flex:1; background:none; color:var(--muted); font-size:12px; padding:10px 0 12px; border-radius:0; }
  .nav button.active { color:var(--teal); font-weight:800; }
  .stepper { display:flex; align-items:center; gap:10px; }
  .stepper button { width:46px; height:46px; font-size:20px; background:var(--input-bg); color:var(--teal); border:1px solid var(--border); border-radius:12px; }
  .stepper .val { font-size:20px; font-weight:700; min-width:80px; text-align:center; font-variant-numeric:tabular-nums; }
  .field, select.field { width:100%; padding:11px; border:1px solid var(--border); background:var(--card); color:var(--text); border-radius:10px; font-size:15px; margin:6px 0 10px; }
  .modal-bg { position:fixed; inset:0; background:rgba(11,50,46,.55); z-index:20; display:flex; align-items:flex-end; }
  .modal { background:var(--card); width:100%; max-width:520px; margin:0 auto; border-radius:20px 20px 0 0; padding:18px 16px 24px; max-height:88vh; overflow-y:auto; border-top:4px solid var(--terra); }
  .chart { width:100%; height:160px; }
  .tag { display:inline-block; background:var(--chip); color:var(--teal); border-radius:6px; padding:2px 7px; font-size:11px; font-weight:700; }
  .empty { text-align:center; color:var(--muted); padding:30px 10px; font-size:14px; }
  #scanWrap video { width:100%; border-radius:12px; background:#000; }
  .hint { font-size:12px; color:var(--muted); margin:6px 0; }
  .thumb { width:40px; height:40px; border-radius:10px; object-fit:cover; background:var(--input-bg); flex-shrink:0; border:1px solid var(--border); }
  .thumb-lg { width:100%; height:150px; object-fit:cover; border-radius:12px; background:var(--input-bg); margin-bottom:6px; }
  .seg { display:flex; gap:6px; margin-bottom:10px; }
  .seg button { flex:1; background:var(--input-bg); color:var(--muted); }
  .seg button.on { background:var(--teal); color:#fff; }
  .kpis { display:flex; gap:8px; margin-bottom:10px; }
  .kpi { flex:1; background:linear-gradient(160deg, var(--green-soft), var(--card)); border:1px solid var(--border); border-radius:14px; padding:10px; text-align:center; }
  .kpi b { display:block; font-size:17px; color:var(--teal-deep); }
  .kpi span { font-size:11px; color:var(--muted); }
  /* Timer overlay */
  #timerBox { position:fixed; right:12px; bottom:76px; background:var(--card); color:var(--text); border-radius:18px; padding:14px 16px; z-index:30; box-shadow:0 6px 20px rgba(11,79,74,.35); text-align:center; border:1px solid var(--border); border-top:3px solid var(--terra); }
  #timerBox .t { font-size:34px; font-weight:800; font-variant-numeric:tabular-nums; color:var(--teal-deep); }
  #timerBox .lbl { font-size:11px; color:var(--muted); margin-bottom:2px; }
  #timerBox .bar { height:5px; background:var(--input-bg); border-radius:3px; margin:8px 0; overflow:hidden; }
  #timerBox .bar div { height:100%; background:linear-gradient(90deg, var(--teal), var(--green)); width:100%; border-radius:3px; }
  #timerBox.done .bar div { background:linear-gradient(90deg, var(--terra), var(--terra-deep)); }
  #timerBox .btns { display:flex; gap:6px; justify-content:center; }
  #timerBox.done { animation:pulse 1s infinite; }
  @keyframes pulse { 50% { transform:scale(1.04); } }
  body.dark .kpi b { color:var(--teal); }
</style>
</head>
<body>
<header>
  <div><h1>💪 Kracht Tracker</h1><span class="today" id="hdrDate"></span></div>
  <button onclick="openSettings()">⚙️</button>
</header>
<main id="app"></main>
<div class="nav" id="nav"></div>
<div id="modalRoot"></div>
<div id="timerRoot"></div>

<script>
"use strict";
const KEY = "krachttracker_v2";
let db = load();
let view = "home";

function load() {
  let d;
  try { d = JSON.parse(localStorage.getItem(KEY)) || null; } catch(e) { d = null; }
  if (!d) {
    // migrate v1
    let old = null;
    try { old = JSON.parse(localStorage.getItem("krachttracker_v1")); } catch(e) {}
    if (old && old.devices) {
      return {
        devices: old.devices.map(x => ({ id:x.id, name:x.name, photo:null })),
        programs: [{ id:"p1", name:"Mijn programma", deviceIds: old.devices.map(x => x.id) }],
        sessions: old.sessions || [], activeProgram:"p1",
        settings: { restSec:60, dark:false }
      };
    }
    return { devices:[], programs:[], sessions:[], activeProgram:null, settings:{ restSec:60, dark:false } };
  }
  if (!d.settings) d.settings = { restSec:60, dark:false };
  return d;
}
function save() { localStorage.setItem(KEY, JSON.stringify(db)); }
function todayISO() { return new Date().toISOString().slice(0,10); }
function fmtDate(iso) { return new Date(iso + "T12:00:00").toLocaleDateString("nl-NL",{day:"numeric",month:"short"}); }
function deviceById(id) { return db.devices.find(d => d.id === id); }
function programById(id) { return db.programs.find(p => p.id === id); }
function activeProgram() { return programById(db.activeProgram) || db.programs[0] || null; }
function progDevices() {
  const p = activeProgram();
  return p ? p.deviceIds.map(deviceById).filter(Boolean) : [];
}
function daysSince(iso) {
  return Math.floor((new Date(todayISO() + "T12:00:00") - new Date(iso + "T12:00:00")) / 86400000);
}
function lastPerf(devId, beforeDate) {
  let best = null;
  for (const s of db.sessions) {
    if (beforeDate && s.date >= beforeDate) continue;
    for (const e of s.entries) {
      if (e.deviceId === devId && !e.skipped && e.weight > 0) best = { entry:e, date:s.date };
    }
  }
  return best;
}
function todaySession() { return db.sessions.find(s => s.date === todayISO()); }
function ensureToday() {
  let s = todaySession();
  if (!s) { s = { date: todayISO(), programId: db.activeProgram, entries: [] }; db.sessions.push(s); save(); }
  return s;
}
function entryFor(session, devId) { return session.entries.find(e => e.deviceId === devId); }
function volumeOf(entry) { return entry.skipped ? 0 : (entry.weight * entry.sets * entry.reps || 0); }
function volSince(days) {
  const from = new Date(); from.setDate(from.getDate() - days);
  const f = from.toISOString().slice(0,10);
  return db.sessions.reduce((tot, s) => s.date >= f ? tot + s.entries.reduce((t,e)=>t+volumeOf(e),0) : tot, 0);
}

/* ---------- settings / dark mode ---------- */
function applyDark() { document.body.classList.toggle("dark", !!db.settings.dark); }
function openSettings() {
  modal(`<h2>Instellingen</h2>
  <div class="row"><div><div class="name">Standaard rusttijd</div>
    <div class="sub">Start automatisch na het invoeren van een oefening</div></div></div>
  <div class="stepper" style="justify-content:center;margin:6px 0 4px">
    <button onclick="stepRest(-15)">−</button>
    <span class="val"><span id="setR">${db.settings.restSec}</span> sec</span>
    <button onclick="stepRest(15)">＋</button>
  </div>
  <p></p>
  <div class="row"><div class="name">Dark mode</div>
    <button class="${db.settings.dark?"btn-green":"btn-ghost"} btn-sm" onclick="toggleDarkBtn(this)">${db.settings.dark?"Aan":"Uit"}</button></div>
  <p></p>
  <button class="btn-green big" onclick="closeModal()">Klaar</button>`);
}
window._rest = null;
function stepRest(d) {
  if (window._rest === null) window._rest = db.settings.restSec;
  window._rest = Math.max(15, Math.min(600, window._rest + d));
  document.getElementById("setR").textContent = window._rest;
  db.settings.restSec = window._rest; save();
}
function toggleDarkBtn(btn) {
  db.settings.dark = !db.settings.dark; save(); applyDark();
  btn.textContent = db.settings.dark ? "Aan" : "Uit";
  btn.className = (db.settings.dark ? "btn-green" : "btn-ghost") + " btn-sm";
  render();
}

/* ---------- UI helpers ---------- */
function render() {
  applyDark();
  document.getElementById("hdrDate").textContent = fmtDate(todayISO());
  const app = document.getElementById("app");
  app.innerHTML = "";
  if (view === "home") renderHome(app);
  if (view === "devices") renderDevices(app);
  if (view === "progress") renderProgress(app);
  renderNav();
}
function renderNav() {
  const nav = document.getElementById("nav");
  const tabs = [["home","🏋️ Vandaag"],["devices","📋 Programma's"],["progress","📈 Voortgang"]];
  nav.innerHTML = tabs.map(([v,l]) =>
    `<button class="${view===v?"active":""}" onclick="view='${v}';render()">${l}</button>`).join("");
}
function modal(html) {
  document.getElementById("modalRoot").innerHTML =
    `<div class="modal-bg" onclick="if(event.target===this)closeModal()"><div class="modal">${html}</div></div>`;
}
function closeModal() {
  document.getElementById("modalRoot").innerHTML = "";
  stopScan();
}

/* ---------- Home / training ---------- */
function renderHome(app) {
  if (db.programs.length === 0) {
    app.innerHTML = `<div class="card"><h2>Begin hier</h2>
      <p class="hint">Maak je eerste programma en voeg apparaten toe — of probeer met voorbeelddata.</p>
      <button class="btn-blue big" onclick="newProgram()">＋ Maak programma</button>
      <p></p>
      <button class="btn-ghost big" onclick="seedDemo()">Voorbeelddata laden</button></div>`;
    return;
  }
  const p = activeProgram();
  const s = ensureToday();
  let html = `<div class="card"><h2>Programma</h2>
    <select class="field" onchange="db.activeProgram=this.value;save();render()">
      ${db.programs.map(pr => `<option value="${pr.id}" ${pr.id===p.id?"selected":""}>${pr.name}</option>`).join("")}
    </select>
    <div class="kpis">
      <div class="kpi"><b>${volToday()}</b><span>kg · vandaag</span></div>
      <div class="kpi"><b>${volSince(7)}</b><span>kg · 7 dagen</span></div>
      <div class="kpi"><b>${volSince(30)}</b><span>kg · 30 dagen</span></div>
    </div></div>`;
  const devs = progDevices();
  if (devs.length === 0) {
    html += `<div class="card"><div class="empty">Dit programma is leeg. Voeg oefeningen toe (op het tabblad Programma's) of scan er één.</div></div>`;
  }
  html += `<div class="card"><h2>Training van vandaag</h2>`;
  devs.forEach((dev, i) => {
    const e = entryFor(s, dev.id);
    const prev = lastPerf(dev.id, todayISO());
    const cls = e ? (e.skipped ? "skipped" : "done") : "";
    const status = e ? (e.skipped ? "overgeslagen" : `✓ ${e.weight} kg × ${e.sets} (${e.reps} herh.)`) : "nog niet gedaan";
    let freq = "";
    const lp = lastPerf(dev.id);
    if (!e && lp) {
      const wks = Math.floor(daysSince(lp.date) / 7);
      if (wks >= 2) freq = `<div class="warn">⚠️ al ${wks} ${wks===1?"week":"weken"} niet gedaan</div>`;
    }
    html += `<div class="row ${cls}">
      <div onclick="openLog('${dev.id}')">
        <div class="name">${i+1}. ${dev.name}</div>
        <div class="sub">Vorige keer: ${prev ? prev.entry.weight + " kg × " + prev.entry.sets : "—"} · nu: ${status}</div>
        ${freq}
      </div>
      <div>
        ${!e ? `<button class="btn-green btn-sm" onclick="openLog('${dev.id}')">Vul in</button>` : ""}
        ${e && !e.skipped ? `<button class="btn-ghost btn-sm" onclick="openLog('${dev.id}')">✎</button>
          <button class="btn-ghost btn-sm" onclick="toggleSkip('${dev.id}')">sla over</button>` : ""}
        ${e && e.skipped ? `<button class="btn-ghost btn-sm" onclick="toggleSkip('${dev.id}')">herstel</button>` : ""}
      </div>
    </div>`;
  });
  html += `</div>
  <button class="btn-blue big" style="font-size:18px;padding:16px" onclick="openScanToTrain()">📷 Scan apparaat om te trainen</button>
  <p style="height:10px"></p>
  <button class="btn-blue big" onclick="openAddDevice()">＋ Nieuw apparaat scannen tijdens training</button>`;
  app.innerHTML = html;
}
function volToday() {
  const s = todaySession();
  return s ? s.entries.reduce((t,e)=>t+volumeOf(e),0) : 0;
}
function toggleSkip(devId) {
  const s = todaySession();
  let e = entryFor(s, devId);
  if (!e) { e = { deviceId:devId, weight:0, sets:0, reps:0, skipped:true }; s.entries.push(e); }
  else e.skipped = !e.skipped;
  save(); render();
}
function openLog(devId) {
  const dev = deviceById(devId);
  const s = ensureToday();
  let e = entryFor(s, devId);
  const prev = lastPerf(devId, todayISO());
  if (!e) e = { deviceId:devId, weight: prev?prev.entry.weight:20, sets: prev?prev.entry.sets:3, reps: prev?prev.entry.reps:10, skipped:false };
  modal(`<h2 style="margin-bottom:4px">${dev.name}</h2>
    ${dev.photo ? `<img class="thumb-lg" src="${dev.photo}" alt="">` : ""}
    <p class="hint">${prev ? "Vorige keer: " + prev.entry.weight + " kg × " + prev.entry.sets + " sets, " + prev.entry.reps + " herh." : "Eerste keer op dit apparaat."}</p>
    <div class="row" style="border:none;padding:4px 0"><span>Gewicht</span></div>
    <div class="stepper" style="justify-content:center">
      <button onclick="stepVal('w',-2.5)">−</button>
      <span class="val"><span id="mW">${e.weight}</span> kg</span>
      <button onclick="stepVal('w',2.5)">＋</button>
    </div>
    <div class="row" style="border:none;padding:4px 0;margin-top:6px"><span>Sets</span></div>
    <div class="stepper" style="justify-content:center">
      <button onclick="stepVal('s',-1)">−</button>
      <span class="val"><span id="mS">${e.sets}</span></span>
      <button onclick="stepVal('s',1)">＋</button>
    </div>
    <div class="row" style="border:none;padding:4px 0;margin-top:6px"><span>Herhalingen per set</span></div>
    <div class="stepper" style="justify-content:center">
      <button onclick="stepVal('r',-1)">−</button>
      <span class="val"><span id="mR">${e.reps}</span></span>
      <button onclick="stepVal('r',1)">＋</button>
    </div>
    <div class="row" style="border:none;padding:4px 0;margin-top:6px"><span>Volume: <b id="mV">${e.weight*e.sets*e.reps}</b> kg</span></div>
    <p></p>
    <button class="btn-green big" onclick="saveLog('${devId}')">Opslaan + rusttimer</button>
    <p></p>
    <button class="btn-ghost big" onclick="closeModal()">Annuleer</button>`);
  window._log = { w:e.weight, s:e.sets, r:e.reps };
}
function stepVal(k, d) {
  window._log[k] = Math.max(0, Math.round((window._log[k] + d) * 10) / 10);
  const map = { w:"mW", s:"mS", r:"mR" };
  document.getElementById(map[k]).textContent = window._log[k];
  document.getElementById("mV").textContent = Math.round(window._log.w * window._log.s * window._log.r);
}
function saveLog(devId) {
  const s = ensureToday();
  let e = entryFor(s, devId);
  if (!e) { e = { deviceId:devId }; s.entries.push(e); }
  e.weight = window._log.w; e.sets = window._log.s; e.reps = window._log.r; e.skipped = false;
  save(); closeModal(); render();
  startTimer(db.settings.restSec, deviceById(devId).name);
}

/* ---------- Rusttimer ---------- */
let timerInt = null;
function startTimer(secs, label) {
  stopTimer();
  const end = Date.now() + secs * 1000;
  const total = secs;
  const root = document.getElementById("timerRoot");
  root.innerHTML = `<div id="timerBox">
    <div class="lbl">Rust · ${label}</div>
    <div class="t" id="tVal">${secs}</div>
    <div class="bar"><div id="tBar"></div></div>
    <div class="btns">
      <button class="btn-ghost btn-sm" onclick="adjustTimer(30)">+30s</button>
      <button class="btn-ghost btn-sm" id="tPause" onclick="pauseTimer()">Pause</button>
      <button class="btn-red btn-sm" onclick="stopTimer()">✕</button>
    </div></div>`;
  window._timerEnd = end; window._timerPaused = false;
  timerInt = setInterval(tick, 250);
  tick();
}
function tick() {
  if (window._timerPaused) return;
  const left = Math.max(0, Math.ceil((window._timerEnd - Date.now()) / 1000));
  const el = document.getElementById("tVal"); if (!el) { stopTimer(); return; }
  el.textContent = left;
  const box = document.getElementById("timerBox");
  const total = window._timerTotal || db.settings.restSec;
  const frac = window._timerTotal ? left / window._timerTotal : 0;
  document.getElementById("tBar").style.width = (frac * 100) + "%";
  if (left <= 0) {
    clearInterval(timerInt); timerInt = null;
    box.classList.add("done");
    document.getElementById("tVal").textContent = "Klaar!";
    beep();
    setTimeout(() => { if (document.getElementById("timerBox")) stopTimer(); }, 6000);
  }
}
function adjustTimer(add) {
  window._timerEnd += add * 1000;
  window._timerTotal = (window._timerTotal || db.settings.restSec) + add;
  if (timerInt === null) { // restart after done
    const left = Math.max(0, Math.ceil((window._timerEnd - Date.now()) / 1000));
    startTimerSilent(left);
  }
}
function startTimerSilent(secs) {
  const box = document.getElementById("timerBox");
  if (!box) return startTimer(secs, "");
  box.classList.remove("done");
  window._timerPaused = false;
  timerInt = setInterval(tick, 250);
}
function pauseTimer() {
  window._timerPaused = !window._timerPaused;
  if (window._timerPaused) { window._timerLeftAt = window._timerEnd - Date.now(); }
  else { window._timerEnd = Date.now() + (window._timerLeftAt || 0); }
  document.getElementById("tPause").textContent = window._timerPaused ? "Hervat" : "Pause";
}
function stopTimer() {
  if (timerInt) { clearInterval(timerInt); timerInt = null; }
  document.getElementById("timerRoot").innerHTML = "";
}
function beep() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    [0, 0.25, 0.5].forEach(t0 => {
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.frequency.value = 880; o.connect(g); g.connect(ctx.destination);
      g.gain.setValueAtTime(0.3, ctx.currentTime + t0);
      g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + t0 + 0.18);
      o.start(ctx.currentTime + t0); o.stop(ctx.currentTime + t0 + 0.2);
    });
  } catch(e) {}
}

/* ---------- Programma's & apparaten ---------- */
function newProgram() {
  const n = prompt("Naam van het programma (bijv. 'Dag A – borst/rug'):");
  if (!n || !n.trim()) return;
  const id = "p" + Date.now();
  db.programs.push({ id, name: n.trim(), deviceIds: [] });
  db.activeProgram = id;
  save(); closeModal(); render();
}
function openAddDevice(scannedCode) {
  modal(`<h2>Nieuw apparaat</h2>
    <p class="hint">${scannedCode ? "QR-code gelezen: <b>" + scannedCode + "</b>. Wat is dit voor apparaat?" :
      "Scan de QR-code op het apparaat, of voer handmatig een code in."}</p>
    <div id="scanWrap"></div>
    <button class="btn-blue big" id="scanBtn" onclick="startScan()">📷 Scan QR-code</button>
    <p></p>
    <input class="field" id="devCode" placeholder="Code (bijv. TG-014)" value="${scannedCode || ""}">
    <input class="field" id="devName" placeholder="Naam apparaat (bijv. Chest Press)" list="tgNames">
    <datalist id="tgNames"><option>Chest Press</option><option>Lat Machine</option><option>Leg Press</option><option>Leg Curl</option><option>Leg Extension</option><option>Shoulder Press</option><option>Rowing Machine</option><option>Arm Curl</option><option>Arm Extension</option><option>Abdominal Crunch</option><option>Low Row</option><option>Pulldown</option></datalist>
    <input class="field" id="devPhoto" type="file" accept="image/*" capture="environment" onchange="storePhoto(this)">
    <p class="hint">Foto van het apparaat (optioneel)</p>
    <button class="btn-green big" onclick="addDevice()">Toevoegen aan ${activeProgram() ? activeProgram().name : "programma"}</button>
    <p></p>
    <button class="btn-ghost big" onclick="closeModal()">Annuleer</button>`);
  if (scannedCode) { document.getElementById("scanBtn").style.display = "none"; document.getElementById("devName").focus(); }
}
window._photo = null;
function storePhoto(input) {
  const f = input.files && input.files[0];
  if (!f) return;
  const img = new Image();
  const rd = new FileReader();
  rd.onload = () => {
    img.onload = () => {
      const c = document.createElement("canvas");
      const scale = Math.min(1, 500 / Math.max(img.width, img.height));
      c.width = img.width * scale; c.height = img.height * scale;
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      window._photo = c.toDataURL("image/jpeg", 0.7);
    };
    img.src = rd.result;
  };
  rd.readAsDataURL(f);
}
function addDevice() {
  const code = (document.getElementById("devCode").value || "").trim() || ("APP-" + Date.now());
  const name = (document.getElementById("devName").value || "").trim();
  if (!name) { alert("Vul een naam in voor het apparaat."); return; }
  let dev = deviceById(code);
  if (!dev) {
    dev = { id: code, name: name, photo: window._photo || null };
    db.devices.push(dev);
  } else if (!confirm("Code bestaat al (" + dev.name + "). Deze oefening toevoegen aan het programma?")) return;
  const p = activeProgram();
  if (p && !p.deviceIds.includes(code)) p.deviceIds.push(code);
  save(); closeModal(); render();
}
function renderDevices(app) {
  let html = "";
  if (db.programs.length === 0) {
    app.innerHTML = `<div class="card"><div class="empty">Nog geen programma's. Maak je eerste programma aan.</div></div>
      <button class="btn-blue big" onclick="newProgram()">＋ Nieuw programma</button>`;
    return;
  }
  const p = activeProgram();
  html += `<div class="card"><h2>Mijn programma's</h2>
    ${db.programs.map(pr => {
      const active = pr.id === p.id;
      return `<div class="row">
        <div onclick="db.activeProgram='${pr.id}';save();render()">
          <div class="name">${active ? "▶ " : ""}${pr.name}</div>
          <div class="sub">${pr.deviceIds.length} oefeningen</div>
        </div>
        <div>
          <button class="btn-ghost btn-sm" onclick="renameProgram('${pr.id}')">✎</button>
          <button class="btn-red btn-sm" onclick="deleteProgram('${pr.id}')">🗑</button>
        </div></div>`;
    }).join("")}
    <p style="height:8px"></p>
    <button class="btn-blue big" onclick="newProgram()">＋ Nieuw programma</button></div>`;

  html += `<div class="card"><h2>Oefeningen in "${p.name}"</h2>`;
  const devs = p.deviceIds.map(deviceById).filter(Boolean);
  if (devs.length === 0) html += `<div class="empty">Nog geen oefeningen in dit programma.</div>`;
  devs.forEach((dev, i) => {
    const inOther = db.programs.filter(pr => pr.id !== p.id && pr.deviceIds.includes(dev.id)).length;
    const total = db.sessions.reduce((n, s) => n + s.entries.filter(e => e.deviceId === dev.id && !e.skipped).length, 0);
    html += `<div class="row">
      <div style="display:flex;gap:10px;align-items:center">
        ${dev.photo ? `<img class="thumb" src="${dev.photo}">` : `<div class="thumb"></div>`}
        <div><div class="name">${i+1}. ${dev.name}</div>
        <div class="sub"><span class="tag">${dev.id}</span> · ${total}× gedaan${inOther ? " · ook in " + inOther + " ander program" + (inOther>1?"ma's":"ma") : ""}</div></div>
      </div>
      <div>
        <button class="btn-ghost btn-sm" onclick="editDevice('${dev.id}')">✎</button>
        ${i>0?`<button class="btn-ghost btn-sm" onclick="moveDevice('${dev.id}',-1)">↑</button>`:""}
        ${i<devs.length-1?`<button class="btn-ghost btn-sm" onclick="moveDevice('${dev.id}',1)">↓</button>`:""}
        <button class="btn-red btn-sm" onclick="removeFromProgram('${dev.id}')">−</button>
      </div></div>`;
  });
  html += `</div>
  <button class="btn-blue big" onclick="openAddDevice()">＋ Oefening toevoegen (scan / zoeken)</button>
  <p></p>
  <button class="btn-ghost big" onclick="exportCSV()">⬇️ Export naar CSV</button>`;

  // Alle apparaten (bibliotheek) incl. volledig verwijderen
  if (db.devices.length > 0) {
    html += `<div class="card" style="margin-top:14px"><h2>Alle oefeningen</h2>
    ${db.devices.map(dev => {
      const usage = db.sessions.reduce((n,s)=>n+s.entries.filter(e=>e.deviceId===dev.id && !e.skipped).length,0);
      return `<div class="row"><div class="name" style="font-size:14px">${dev.name} <span class="sub">(${usage} sessies)</span></div>
      <button class="btn-red btn-sm" onclick="deleteDeviceFull('${dev.id}')">verwijder alles</button></div>`;
    }).join("")}</div>`;
  }
  app.innerHTML = html;
}
function renameProgram(id) {
  const pr = programById(id);
  const n = prompt("Nieuwe naam:", pr.name);
  if (n && n.trim()) { pr.name = n.trim(); save(); render(); }
}
function deleteProgram(id) {
  if (db.programs.length <= 1) { alert("Je laatste programma kun je niet verwijderen."); return; }
  if (!confirm("Programma verwijderen? De oefeningen en historie blijven bewaard.")) return;
  db.programs = db.programs.filter(p => p.id !== id);
  if (db.activeProgram === id) db.activeProgram = db.programs[0].id;
  save(); render();
}
function moveDevice(id, dir) {
  const p = activeProgram();
  const i = p.deviceIds.indexOf(id);
  const j = i + dir;
  [p.deviceIds[i], p.deviceIds[j]] = [p.deviceIds[j], p.deviceIds[i]];
  save(); render();
}
function removeFromProgram(id) {
  const p = activeProgram();
  p.deviceIds = p.deviceIds.filter(x => x !== id);
  save(); render();
}
function editDevice(id) {
  const dev = deviceById(id);
  const n = prompt("Nieuwe naam:", dev.name);
  if (n !== null && n.trim()) { dev.name = n.trim(); save(); render(); }
  const f = prompt("Foto vervangen? Plak niets — tik op annuleren als je de foto wilt houden. Typ 'verwijder' om de foto te wissen.");
  if (f && f.toLowerCase().startsWith("verw")) { dev.photo = null; save(); render(); }
}
function deleteDeviceFull(id) {
  const dev = deviceById(id);
  if (!confirm(`Oefening "${dev.name}" volledig verwijderen?\n\nDit wist ook de gehele historie (${db.sessions.reduce((n,s)=>n+s.entries.filter(e=>e.deviceId===id).length,0)} metingen).`)) return;
  db.devices = db.devices.filter(d => d.id !== id);
  db.programs.forEach(p => p.deviceIds = p.deviceIds.filter(x => x !== id));
  db.sessions.forEach(s => s.entries = s.entries.filter(e => e.deviceId !== id));
  save(); render();
}

/* ---------- QR scanning ---------- */
let scanStream = null, scanTimer = null;
function openScanToTrain() {
  modal(`<h2>Scan apparaat</h2>
    <p class="hint">Wijs de camera op de QR-code van het apparaat. Bekende apparaten openen meteen je instellingen; onbekende vragen eerst om een naam.</p>
    <div id="scanWrap"></div>
    <button class="btn-blue big" onclick="startScan()">📷 Camera starten</button>
    <p></p>
    <button class="btn-ghost big" onclick="closeModal()">Annuleer</button>`);
  startScan();
}
async function startScan() {
  stopScan();
  const wrap = document.getElementById("scanWrap");
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    alert("Camera niet beschikbaar. Vul de code handmatig in — dat werkt net zo goed.");
    return;
  }
  try {
    scanStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
    const video = document.createElement("video");
    video.srcObject = scanStream; video.setAttribute("playsinline", "true");
    wrap.innerHTML = ""; wrap.appendChild(video);
    await video.play();
    if ("BarcodeDetector" in window) {
      const det = new BarcodeDetector({ formats: ["qr_code"] });
      scanTimer = setInterval(async () => {
        try {
          const codes = await det.detect(video);
          if (codes.length > 0) {
            const val = codes[0].rawValue;
            stopScan(); closeModal();
            if (deviceById(val)) openLog(val); else openAddDevice(val);
          }
        } catch(e) {}
      }, 400);
    } else {
      alert("Automatisch scannen wordt door deze browser niet ondersteund. Typ de code handmatig in het veld.");
    }
  } catch(e) {
    alert("Geen toegang tot camera (of geen beveiligde verbinding). Typ de code handmatig in.");
  }
}
function stopScan() {
  if (scanTimer) { clearInterval(scanTimer); scanTimer = null; }
  if (scanStream) { scanStream.getTracks().forEach(t => t.stop()); scanStream = null; }
}

/* ---------- Voortgang ---------- */
function renderProgress(app) {
  if (db.devices.length === 0) { app.innerHTML = `<div class="empty">Nog geen apparaten om voortgang te tonen.</div>`; return; }
  const selected = window._progDev || db.devices[0].id;
  const dev = deviceById(selected);
  let html = `<div class="card"><h2>Volume overzicht</h2>
    <div class="kpis">
      <div class="kpi"><b>${volToday()}</b><span>kg · vandaag</span></div>
      <div class="kpi"><b>${volSince(7)}</b><span>kg · afgelopen week</span></div>
      <div class="kpi"><b>${volSince(30)}</b><span>kg · afgelopen maand</span></div>
    </div>
    <div class="hint">Volume = gewicht × sets × herhalingen</div></div>
    <div class="card"><h2>Voortgang per apparaat</h2>
    <select class="field" onchange="window._progDev=this.value;render()">
      ${db.devices.map(d => `<option value="${d.id}" ${d.id===selected?"selected":""}>${d.name}</option>`).join("")}
    </select></div>`;
  const points = [];
  for (const s of db.sessions) {
    const e = s.entries.find(x => x.deviceId === selected && !x.skipped && x.weight > 0);
    if (e) points.push({ date:s.date, weight:e.weight, sets:e.sets, reps:e.reps });
  }
  if (points.length === 0) {
    html += `<div class="card"><div class="empty">Nog geen resultaten op ${dev.name}.</div></div>`;
    app.innerHTML = html; return;
  }
  const first = points[0], lastP = points[points.length-1];
  const diff = Math.round((lastP.weight - first.weight) * 10) / 10;
  const trend = diff > 0 ? `📈 +${diff} kg` : (diff < 0 ? `📉 ${diff} kg` : "➖ gelijk");
  html += `<div class="card"><h2>${dev.name}</h2>
    <p class="hint">Sinds ${fmtDate(first.date)}: <b>${trend}</b> · laatste: ${lastP.weight} kg × ${lastP.sets} (${lastP.reps} herh.)</p>
    ${points.length > 1 ? lineChart(points) : `<div class="empty">Eén meting geregistreerd — kom terug voor de lijn!</div>`}
    </div>
    <div class="card"><h2>Geschiedenis</h2>
    ${points.slice().reverse().map(p => `<div class="row"><span>${fmtDate(p.date)}</span>
      <span><b>${p.weight} kg</b> × ${p.sets} (${p.reps} herh.)</span></div>`).join("")}
    </div>`;
  app.innerHTML = html;
}
function lineChart(points) {
  const W = 320, H = 140, P = 26;
  const xs = points.map((_, i) => P + (i / (points.length - 1)) * (W - 2 * P));
  const minW = Math.min(...points.map(p => p.weight)), maxW = Math.max(...points.map(p => p.weight));
  const span = Math.max(maxW - minW, 2.5);
  const ys = points.map(p => H - P - ((p.weight - minW) / span) * (H - 2 * P));
  const path = xs.map((x, i) => (i === 0 ? "M" : "L") + x.toFixed(1) + "," + ys[i].toFixed(1)).join(" ");
  const dots = xs.map((x, i) => `<circle cx="${x.toFixed(1)}" cy="${ys[i].toFixed(1)}" r="3.5" fill="#c96a4a"/>`).join("");
  const labels = points.map((p, i) => (i === 0 || i === points.length - 1 || points.length <= 6)
    ? `<text x="${xs[i].toFixed(1)}" y="${H-8}" font-size="9" text-anchor="middle" fill="#8b98a5">${fmtDate(p.date).replace(" ","\u00A0")}</text>` : "").join("");
  return `<svg class="chart" viewBox="0 0 ${W} ${H}">
    <line x1="${P}" y1="${H-P}" x2="${W-P}" y2="${H-P}" stroke="#8b98a5" opacity=".4"/>
    <path d="${path}" fill="none" stroke="#137a70" stroke-width="2.5"/>${dots}${labels}</svg>`;
}

/* ---------- CSV export ---------- */
function exportCSV() {
  const rows = [["datum","programma","oefening","code","gewicht_kg","sets","herhalingen","overgeslagen","volume_kg"]];
  const nameOf = pid => { const p = programById(pid); return p ? p.name : ""; };
  for (const s of db.sessions) {
    for (const e of s.entries) {
      const d = deviceById(e.deviceId);
      rows.push([s.date, nameOf(s.programId), d ? d.name : e.deviceId, e.deviceId,
        e.weight, e.sets, e.reps, e.skipped ? "ja" : "nee", volumeOf(e)]);
    }
  }
  const csv = rows.map(r => r.map(c => '"' + String(c).replace(/"/g,'""') + '"').join(";")).join("\r\n");
  const blob = new Blob(["\ufeff" + csv], { type: "text/csv;charset=utf-8" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "krachttracker_" + todayISO() + ".csv";
  document.body.appendChild(a); a.click(); a.remove();
  alert("CSV gedownload: " + (rows.length - 1) + " metingen. Je kunt het bestand openen in Excel of mailen als backup.");
}

/* ---------- Demo data ---------- */
function seedDemo() {
  const demo = [["TG-101","Chest Press"],["TG-102","Lat Machine"],["TG-103","Leg Press"],["TG-104","Shoulder Press"],["TG-105","Leg Curl"]];
  demo.forEach(([id, name]) => db.devices.push({ id, name, photo:null }));
  db.programs.push({ id:"pA", name:"Dag A – Bovenlichaam", deviceIds:["TG-101","TG-102","TG-104"] });
  db.programs.push({ id:"pB", name:"Dag B – Benen", deviceIds:["TG-103","TG-105"] });
  db.activeProgram = "pA";
  for (let w = 8; w >= 0; w--) {
    const d = new Date(); d.setDate(d.getDate() - w * 7);
    const iso = d.toISOString().slice(0,10);
    const pid = w % 2 === 0 ? "pA" : "pB";
    const ids = pid === "pA" ? ["TG-101","TG-102","TG-104"] : ["TG-103","TG-105"];
    db.sessions.push({ date: iso, programId: pid, entries: ids.map((id, i) => ({
      deviceId:id, weight: 25 + i * 7.5 + (8 - w) * 2.5, sets:3, reps:10, skipped:false })) });
  }
  save(); render();
}

render();
</script>
